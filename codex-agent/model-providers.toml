# Shared provider registry for every managed Codex profile. Keep each gateway
# under a distinct ID: a resumed thread may need to resolve any earlier provider
# before the newly selected model card takes effect.
# Keep retired IDs with their last usable routes: removing an ID breaks resume
# for sessions that recorded it, even when a new profile selects another model.

[model_providers.deepseek]
name = "DeepSeek"
base_url = "http://127.0.0.1:8788/v1"
# Direct fallback when disabling the shim: https://api.deepseek.com/v1
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"
requires_openai_auth = false

