# `codex -p qwen` model card. Layered over the shared-home base config
# (~/.codex-agent/codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "qwen3.8-max"
model_provider = "qwen"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432
model_catalog_json = "@HOME@/.codex-agent/codex/model-catalogs/qwen.json"

# Non-GPT gateways: keep the search tool off.
web_search = "disabled"

[model_providers.qwen]
name = "Qwen"
base_url = "http://127.0.0.1:8792/compatible-mode/v1"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 直连原值；停用 shim 时改回本行
env_key = "QWEN_API_KEY"
wire_api = "responses"
requires_openai_auth = false
