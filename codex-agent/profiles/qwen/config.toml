model = "qwen3.8-max"
model_provider = "qwen"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432
model_catalog_json = "@HOME@/.codex-agent/qwen/model-catalog.json"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

web_search = "disabled"

service_tier = "default"

# Allow only the environment needed by development tools. Model credentials
# remain in the Codex parent process and are not inherited by tool shells.
# Prevent login profiles from reintroducing credentials into tool shells.
allow_login_shell = false

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.filters]
"PATH" = "include"
"HOME" = "include"
"USER" = "include"
"LOGNAME" = "include"
"SHELL" = "include"
"TMPDIR" = "include"
"TMP" = "include"
"TEMP" = "include"
"LANG" = "include"
"LC_*" = "include"
"TERM" = "include"
"COLORTERM" = "include"
"TERM_PROGRAM" = "include"
"TZ" = "include"
"NO_COLOR" = "include"
"CLICOLOR" = "include"
"CI" = "include"
"VIRTUAL_ENV" = "include"
"CONDA_PREFIX" = "include"
"PYENV_ROOT" = "include"
"NVM_DIR" = "include"
"*KEY*" = "exclude"
"*TOKEN*" = "exclude"
"*SECRET*" = "exclude"
"*PASSWORD*" = "exclude"
"*CREDENTIAL*" = "exclude"
"*AUTHORIZATION*" = "exclude"
"SSH_AUTH_SOCK" = "include"

[model_providers.qwen]
name = "Qwen"
base_url = "http://127.0.0.1:8792/compatible-mode/v1"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 直连原值；停用 shim 时改回本行
env_key = "QWEN_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[marketplaces.openai-codex]
source_type = "local"
source = "@HOME@/.codex-agent/local-marketplaces/openai-codex"
