# `codex -p glm-flash` model card. Layered over the shared-home base config
# (~/.codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "glm-5.3-flash"
model_provider = "glm"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432

# Non-GPT gateways: keep the search tool off.
web_search = "disabled"

[model_providers.glm]
name = "GLM"
base_url = "http://127.0.0.1:8795/api/v1"
# base_url = "https://open.bigmodel.cn/api/v1"  # 直连原值；停用 shim 时改回本行
env_key = "GLM_API_KEY"
wire_api = "responses"
requires_openai_auth = false
