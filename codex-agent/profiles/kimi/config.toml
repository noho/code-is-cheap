# `codex -p kimi` model card. Layered over the shared-home base config
# (~/.codex-agent/codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "kimi-k3"
model_provider = "kimi"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432
model_catalog_json = "@HOME@/.codex-agent/codex/model-catalogs/kimi.json"

# Non-GPT gateways: keep the search tool off.
web_search = "disabled"

[model_providers.kimi]
name = "Kimi"
base_url = "http://127.0.0.1:8790/coding/v1"
# base_url = "https://api.kimi.com/coding/v1"  # 直连原值；停用 shim 时改回本行
env_key = "KIMI_API_KEY"
wire_api = "responses"
requires_openai_auth = false
