# `codex -p mimo` model card. Layered over the shared-home base config
# (~/.codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "mimo-v2.6-pro"
model_provider = "mimo"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432
model_catalog_json = "@HOME@/.codex/model-catalogs/mimo.json"

# mimo gateway rejects the tool: "tool type 'web_search' is not supported by
# this gateway phase". Keep it disabled for this profile.
web_search = "disabled"

[model_providers.mimo]
name = "MiMo"
base_url = "http://127.0.0.1:8791/v1"
# base_url = "https://token-plan-cn.xiaomimimo.com/v1"  # 直连原值；停用 shim 时改回本行
env_key = "MIMO_PLAN_API_KEY"
wire_api = "responses"
requires_openai_auth = false
