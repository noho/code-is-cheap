# `codex -p mimo-flash` model card. Layered over the shared-home base config
# (~/.codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "mimo-v2.6-flash"
model_provider = "mimo_flash"
model_reasoning_effort = "max"
model_context_window = 1048576
model_auto_compact_token_limit = 786432
model_catalog_json = "@HOME@/.codex/model-catalogs/mimo-flash.json"

# Non-GPT gateways: keep the search tool off (mimo gateway hard-rejects it).
web_search = "disabled"
