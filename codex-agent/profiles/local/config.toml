model = "qwen3.8-27b-local"
model_provider = "local_llama"
model_reasoning_effort = "xhigh"
model_context_window = 262144
model_auto_compact_token_limit = 229376
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

web_search = "disabled"

service_tier = "default"

# Allow only the environment needed by development tools. Model credentials
# remain in the Codex parent process and are not inherited by tool shells.
# Prevent login profiles from reintroducing credentials into tool shells.
allow_login_shell = false

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.filters]
"PATH" = "include"
"HOME" = "include"
"USER" = "include"
"LOGNAME" = "include"
"SHELL" = "include"
"TMPDIR" = "include"
"TMP" = "include"
"TEMP" = "include"
"LANG" = "include"
"LC_*" = "include"
"TERM" = "include"
"COLORTERM" = "include"
"TERM_PROGRAM" = "include"
"TZ" = "include"
"NO_COLOR" = "include"
"CLICOLOR" = "include"
"CI" = "include"
"VIRTUAL_ENV" = "include"
"CONDA_PREFIX" = "include"
"PYENV_ROOT" = "include"
"NVM_DIR" = "include"
"*KEY*" = "exclude"
"*TOKEN*" = "exclude"
"*SECRET*" = "exclude"
"*PASSWORD*" = "exclude"
"*CREDENTIAL*" = "exclude"
"*AUTHORIZATION*" = "exclude"
"SSH_AUTH_SOCK" = "include"

[model_providers.local_llama]
name = "Local llama.cpp"
# base_url = "http://127.0.0.1:8793/v1"  # shim 路由（已停用：guardian 超时，local 不走 shim）
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
requires_openai_auth = false

[marketplaces.openai-codex]
source_type = "local"
source = "@HOME@/.codex-agent/local-marketplaces/openai-codex"
