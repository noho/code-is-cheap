# `codex -p local` model card. Layered over the shared-home base config
# (~/.codex/config.toml), which owns policy and machine-local
# runtime state. Only model deltas live here.

model = "qwen3.8-27b-local"
model_provider = "local_llama"
model_reasoning_effort = "xhigh"
model_context_window = 262144
model_auto_compact_token_limit = 229376

# Non-GPT gateways: keep the search tool off.
web_search = "disabled"

# local-only sandbox override: no sandbox on the local llama.cpp service.
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
